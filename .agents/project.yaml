# Project configuration consumed by AI agents (Claude, Cursor, Gemini, Codex, etc.)
# when they encounter {{VAR_NAME}} references in skills, commands, templates and docs.
# Variable names are snake_case; the AI maps {{PROJECT_NAME}} -> project.project_name lexically.
# Edit values manually, or run `bun run agents:setup` for an interactive walkthrough.
# Every unfilled field is `null` plus a TODO comment with a concrete example.

project:
  project_name: Bunkai # Project name (e.g. MyProject)
  project_key: BK # Project key in issue tracker (e.g. PROJ, ACME, UPEX). The boilerplate ships this `null` on purpose — the consumer project fills it; never hardcode a real key here.
  webapp_domain: upexbunkai.vercel.app # Domain of the web application under test (e.g. myproject.com)

backend:
  backend_repo: ../upex-bunkai-tms # Relative path to backend repository (e.g. ../my-backend)
  backend_stack: Next.js + Supabase + Vercel # Backend technology stack (e.g. Node.js + Express)
  backend_entry: ../upex-bunkai-tms/. # Backend source entry point (e.g. src/)

frontend:
  frontend_repo: ../upex-bunkai-tms/. # Relative path to frontend repository (e.g. ../my-frontend)
  frontend_stack: Next.js # Frontend technology stack (e.g. React + TypeScript)
  frontend_entry: ../upex-bunkai-tms/. # Frontend source entry point (e.g. src/)

database:
  db_type: Supabase Postgres # Database engine (e.g. PostgreSQL)

issue_tracker:
  issue_tracker: Jira # Issue tracking tool (e.g. Jira)
  issue_tracker_cli: acli # CLI command to query tickets (e.g. acli (Jira) / gh issue (GitHub))
  atlassian_url: 'https://upexgalaxy72.atlassian.net' # Atlassian site base URL (e.g. https://company.atlassian.net) — only place the host is written, NOT mirrored in .env

testing:
  default_env: staging # Default testing environment — must match a key under `environments:` (e.g. staging)
  tms_cli: bun xray # Test management CLI command (e.g. bun xray). Set to acli (== issue_tracker_cli) -> Modality jira-native, no Xray on Jira.

qa:
  formal_blocked_gate: true # When true and the substrate exposes a `blocked` story status, FAILED stories dispatch `defect_reported` (in_test -> blocked). When false (or no `blocked` slug), the skill leaves the story in `in_test` with the linked bug — non-strict fallback. See sprint-testing/references/sprint-orchestration.md Briefing 4 Step 5.
  qa_artifact_label: QA-Artifact # Jira label carried by every QA process epic (Master Test Plan, Test Repository, Test Artifacts, Defect Management) so they're identifiable without hardcoding keys. Read by scripts/sync-jira-issues.ts (falls back to this same default if unset). See defect-management-doctrine.md Part 4.
  # QA process epics — buckets that hold QA artifacts so they never pollute product epics/roadmap.
  # FOUR QA-process epics form the QA-governance cluster: Test Plans parent to `master_test_plan_epic`;
  # Test (TC) issues parent to `test_repository_epic`; Test Executions/Preconditions/Test Sets parent to
  # `test_artifacts_epic`; Bug/Defect/Improvement parent to `defect_epic`.
  # Skills resolve the epic by NAME (the methodology convention shipped below) and find-or-create it,
  # caching the discovered `*.key` here. NEVER parent a quality issue to a product/dev epic.
  # Read directly by skills (not {{VAR}} tokens) → skipped by vars:check, like git_strategy leaves.
  # Doctrine: .claude/skills/agentic-qa-core/references/defect-management-doctrine.md (Part 4).
  qa_epics:
    master_test_plan_epic:
      name: QA Master Test Plan # the MTP — parent of every Test Plan (FTP/STP/ATP); description mirrors
      # .context/master-test-plan.md + points to the official QA repo; cross-linked to the 3 sibling QA epics
      key: BK-514 # discovered/created at runtime, then cached here (e.g. PROJ-100)
    test_repository_epic:
      name: QA Test Repository # convention name; holds every Test (TC) issue
      key: BK-70 # discovered/created at runtime, then cached here (e.g. PROJ-456)
    test_artifacts_epic:
      name: QA Test Artifacts # holds every Test Execution (FTR/STR/ATR), Precondition, Test Set
      key: BK-515 # discovered/created at runtime, then cached here (e.g. PROJ-789)
    defect_epic:
      name: QA Defect Management # convention name; the `QA ` prefix marks a process epic, not product
      key: BK-183 # discovered/created at runtime, then cached here (e.g. PROJ-123)

# Per-environment config. Add/remove environments freely (production, dev, qa, uat, etc.).
# Each environment must define ALL four keys: web_url, api_url, db_mcp, api_mcp.
# Skills referencing {{WEB_URL}} / {{API_URL}} / {{DB_MCP}} / {{API_MCP}} resolve to the
# active environment (`testing.default_env` above, or a session override).
# For explicit cross-env references use {{environments.<env>.<var>}} (e.g. {{environments.local.web_url}}).
environments:
  local:
    web_url: 'http://localhost:3000' # Frontend URL for local env (e.g. http://localhost:3000)
    api_url: 'http://localhost:3000/api/v1' # API base URL for local env (e.g. http://localhost:3000/api)
    db_mcp: staging-dbhub # No separate local Postgres — local dev shares the same Supabase project as staging (single dbhub.toml source)
    api_mcp: local-openapi # MCP server name for local API (e.g. myproject-local-api)
  qa:
    web_url: null # TODO: Frontend URL for qa env (e.g. https://qa.myproject.com)
    api_url: null # TODO: API base URL for qa env (e.g. https://api-qa.myproject.com)
    db_mcp: null # TODO: MCP server name for qa DB (e.g. myproject-qa-db)
    api_mcp: null # TODO: MCP server name for qa API (e.g. myproject-qa-api)
  staging:
    web_url: 'https://staging-upexbunkai.vercel.app' # Frontend URL for staging env (e.g. https://staging.myproject.com)
    api_url: 'https://staging-upexbunkai.vercel.app/api/v1' # API base URL for staging env (e.g. https://api-staging.myproject.com)
    db_mcp: staging-dbhub # MCP server name for staging DB (e.g. myproject-staging-db)
    api_mcp: staging-openapi # MCP server name for staging API (e.g. myproject-staging-api)
  production:
    web_url: null # TODO: Frontend URL for production env (e.g. https://myproject.com)
    api_url: null # TODO: API base URL for production env (e.g. https://api.myproject.com)
    db_mcp: null # TODO: MCP server name for production DB (e.g. myproject-production-db)
    api_mcp: null # TODO: MCP server name for production API (e.g. myproject-production-api)

# Git workflow for THIS project — the SOURCE OF TRUTH read by the git-flow-master skill
# before any git/gh operation. Ships `null` (template): on the first git intent git-flow-master
# OFFERS "Strategy Setup" and fills these fields (it never auto-picks). Tracked + frozen by the
# updater (bootstrapOnly), so each project keeps its own. Filled by git-flow-master, NOT by
# `agents:setup`. These leaves are read directly (not {{VAR}} template vars) → skipped by vars:check.
git_strategy:
  strategy: solo-main # null until Strategy Setup runs; then one of: solo-main | main-integration | enterprise | trunk-based | gitflow | github-flow | gitlab-flow | sdet
  description: >
    Single long-lived branch (main); single maintainer. Work lands via PR only (direct pushes to main forbidden, changed 2026-08-20 per user decision) — every code-touching change goes through a work branch + gh pr create. Exception added 2026-08-21 per user decision: a change whose staged files are ALL `.md` (documentation-only — no code, no config, no scripts) may push directly to main; any change touching a single non-`.md` file goes through a work branch + PR as usual. No integration branch, no promotion path, no hotfix ceremony.
  branches:
    production: main # release / default branch
    integration: null # long-lived integration branch name (e.g. staging), or null
    ephemeral_pattern: null # on-demand trunk pattern (e.g. "test/<module>-suite" for sdet), or null
  protected: [main] # branches requiring explicit confirm before a direct push
  decisions:
    # captured by the Strategy Setup questionnaire (Q1/Q2/Q3)
    promote_method: n/a # ff-only | merge-commit | squash | n/a
    feature_merge: merge-commit # merge-commit | squash | rebase-merge | n/a — HARD CONSTRAINT, not just convention: GitHub ruleset `rules/branches/main` sets `allowed_merge_methods: ["merge"]` only (verified via `gh api repos/<owner>/<repo>/rules/branches/main` 2026-08-21) — squash/rebase are REJECTED by GitHub itself unless bypassed with `gh pr merge --admin`, which also bypasses `require_code_owner_review`. PR #8 used `--admin --squash` and the admin bypass silently let the disallowed method through — always use `gh pr merge --merge` (`--admin` only to clear the code-owner-review block, never to pick a different merge method). All 7 prior PRs (#1,3,4,5,6,7) used a regular merge commit.
    hotfix_policy: n/a # branch-off-prod-backmerge | via-integration | none | n/a
  policy:
    # how strictly protected branches are guarded (set by Strategy Setup Q4; defaults are safe)
    direct_push_to_protected: forbidden # forbidden | confirm | allowed (solo-main default = allowed; changed to forbidden 2026-08-20 per user decision — all code changes go via PR)
    direct_push_exceptions: # carve-outs to direct_push_to_protected, evaluated BEFORE the base policy above
      - condition: all_staged_files_match # added 2026-08-21 per user decision
        pattern: '*.md' # every staged file in the change set must match (doc-only — no code, no config, no scripts)
        then: allowed # match -> push straight to main
        else: forbidden # any non-.md file in the same change set -> falls back to the base policy (branch + PR)
    admin_bypass: true # team POLICY: may a repo admin bypass PR/protection for urgent changes? actual capability still depends on the GitHub user's role — the skill re-confirms at runtime
    require_pr_reviews: 0 # null | 0 | N — min approvals before merge to a protected branch (informational)
    accepted_divergences: # git:policy verify findings intentionally left open — see .claude/skills/git-flow-master/references/ruleset-parity.md §2b
      - field: main.require_code_owner_review
        enforced: true (no CODEOWNERS file exists, so nobody outside the bypass list can satisfy it)
        accepted: 2026-08-22
        reason: >
          `bun run git:policy verify` first surfaced this drift on 2026-08-22 (the checking tool
          itself shipped in this same boilerplate update) — it is pre-existing host config, not a
          new decision. Accepted as-is pending a team decision on whether to add a CODEOWNERS file
          or turn the host rule off; not blocking pushes in the meantime.
      - field: admin_bypass
        enforced: false (no matching bypass configured on the host ruleset)
        accepted: 2026-08-22
        reason: >
          Declared `true` as policy intent (a repo admin should be able to bypass for urgent
          changes) but the host ruleset does not currently grant it. Same first-surfaced-2026-08-22
          situation as above — accepted until the team decides whether to configure the bypass on
          GitHub or drop the declared intent.
  branch_prefixes:
    precedence: [feat, fix, refactor, test, docs, chore]
    naming_with_key: '{prefix}/{ISSUE-KEY}-{kebab-slug}'
    naming_without_key: '{prefix}/{kebab-slug}'
  meta:
    setup_version: 1
    created: 2026-06-20 # YYYY-MM-DD stamped by Strategy Setup
    policy_verified: 2026-09-05 # stamped by `bun run git:policy verify --stamp` when in parity
    policy_source: accepted # verified | accepted — stamped alongside policy_verified
    strategy_source: chosen # inherited | chosen — this project ran Strategy Setup on 2026-06-20, not a default nobody picked

updater:
  protected_paths: [] # extra synced files this project has hand-merged and wants the updater to stop overwriting (same semantics as the built-in watchlist)
